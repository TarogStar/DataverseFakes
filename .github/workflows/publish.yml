name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # allow the Create GitHub Release step to create releases/upload assets

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      # Fail fast if the tag doesn't match <Version> in the csproj; otherwise a tag pushed before the
      # version bump would pack the previous version and --skip-duplicate would silently skip it.
      - name: Verify tag matches package version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = dotnet msbuild DataverseFakes\DataverseFakes.csproj -getProperty:Version
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG does not match <Version>$version</Version> in DataverseFakes.csproj" }

      - name: Restore
        run: dotnet restore DataverseFakes.sln

      - name: Build
        run: dotnet build DataverseFakes.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DataverseFakes.Tests\DataverseFakes.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Smoke test (net10 type identity)
        run: dotnet test DataverseFakes.Smoke.Net10\DataverseFakes.Smoke.Net10.csproj --configuration Release

      - name: Full test leg (net10 cross-platform)
        run: dotnet test DataverseFakes.Tests.Net10\DataverseFakes.Tests.Net10.csproj --configuration Release

      # dotnet pack reads all package metadata from DataverseFakes.csproj and emits both
      # the .nupkg and (via IncludeSymbols/snupkg) the symbol package. This replaces the
      # previous hand-maintained DataverseFakes.nuspec path.
      - name: Pack
        run: dotnet pack DataverseFakes\DataverseFakes.csproj --configuration Release --no-build --output nupkg

      # `dotnet nuget push *.nupkg` also pushes the co-located *.snupkg automatically.
      - name: Push to NuGet
        run: dotnet nuget push nupkg\*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            nupkg/*.nupkg
            nupkg/*.snupkg
          generate_release_notes: true
