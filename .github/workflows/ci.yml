name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore DataverseFakes.sln

      - name: Build
        run: dotnet build DataverseFakes.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DataverseFakes.Tests\DataverseFakes.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Smoke test (net10 type identity)
        run: dotnet test DataverseFakes.Smoke.Net10\DataverseFakes.Smoke.Net10.csproj --configuration Release

      - name: Full test leg (net10 cross-platform)
        run: dotnet test DataverseFakes.Tests.Net10\DataverseFakes.Tests.Net10.csproj --configuration Release
